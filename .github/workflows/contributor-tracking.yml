name: Contributor Tracking

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]

jobs:
  track-first-contribution:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - name: Check if first contribution
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            
            // Get all merged PRs by this user
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100
            });
            
            const mergedPrs = prs.filter(pr => pr.merged_at !== null && pr.user.login === username);
            const isFirst = mergedPrs.length === 1;
            
            if (isFirst) {
              console.log(`🎉 First contribution detected for ${username}!`);
              
              // Add label to PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['first-contribution', 'incentive-eligible']
              });
              
              // Create comment on PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🎉 **Congratulations @${username}!** 🎉\n\nThis is your first merged contribution to Cloud Cost Optimization Hub!\n\nYou are eligible for a **$25 gift card** as part of our contributor incentive program.\n\nPlease email **contributors@ccoh.io** with:\n- Your GitHub username\n- Your preferred gift card (Amazon or GitHub)\n- Your PR link\n\nThank you for helping build this project! 🚀`
              });
              
              // Append to contributors list
              const fs = require('fs');
              const contributorsFile = 'CONTRIBUTORS.md';
              let content = '';
              
              try {
                content = fs.readFileSync(contributorsFile, 'utf8');
              } catch (e) {
                content = '# Contributors\n\nThank you to everyone who has contributed to Cloud Cost Optimization Hub!\n\n';
              }
              
              const date = new Date().toISOString().split('T')[0];
              const newEntry = `- [@${username}](${context.payload.pull_request.html_url}) - First PR merged on ${date}\n`;
              
              if (!content.includes(username)) {
                fs.writeFileSync(contributorsFile, content + newEntry);
              }
            }
            
            return isFirst;

  update-contributor-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Contributor Stats
        uses: actions/github-script@v7
        with:
          script: |
            // Get all contributors
            const { data: contributors } = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            console.log(`📊 Total Contributors: ${contributors.length}`);
            
            // Create stats badge
            const stats = {
              total_contributors: contributors.length,
              last_updated: new Date().toISOString()
            };
            
            console.log(JSON.stringify(stats, null, 2));